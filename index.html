<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ford Mustang - Rediscover the Classics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Italiana&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Syne:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Fullscreen 3D Canvas Background -->
      <canvas id="showcase-canvas" aria-label="Ford Mustang 3D Showcase"></canvas>

      <!-- HUD UI Overlay -->
      <header class="navbar">
        <div class="brand">
          <svg class="ford-logo" viewBox="0 0 120 48" fill="currentColor">
            <path d="M18.8 28.5c-2.4 0-4.2-.6-5.5-1.7-1.3-1.1-1.9-2.7-1.9-4.8 0-2.3.8-4.3 2.4-6 1.6-1.7 3.8-2.5 6.6-2.5 2.1 0 3.8.5 5 1.5 1.2 1 1.8 2.3 1.8 4 0 1.2-.3 2.2-1 3-.7.8-1.7 1.4-3 1.8 1.1.4 1.9 1 2.5 1.8.6.8.9 1.8.9 3 0 1.9-.7 3.4-2.1 4.5-1.4 1.1-3.3 1.6-5.7 1.6zm.5-12.2c-1.3 0-2.3.4-3.1 1.2-.8.8-1.2 1.8-1.2 3.1 0 1.2.4 2.1 1.1 2.7.7.6 1.7.9 2.9.9 1.2 0 2.2-.3 2.9-.9.7-.6 1.1-1.5 1.1-2.6 0-1.2-.4-2.2-1.1-3-.7-.9-1.6-1.4-2.6-1.4zm.5 11c1.5 0 2.6-.4 3.4-1.1.8-.7 1.2-1.7 1.2-3 0-1.2-.4-2.1-1.2-2.7-.8-.6-1.9-.9-3.3-.9-1.4 0-2.5.3-3.3.9-.8.6-1.2 1.5-1.2 2.7 0 1.3.4 2.3 1.2 3 .8.7 1.9 1.1 3.2 1.1zM52 14h6.5v20H52V14zm18.5 0c3.5 0 6.2.9 8.2 2.7 2 1.8 3 4.3 3 7.5s-1 5.7-3 7.5c-2 1.8-4.7 2.7-8.2 2.7H62V14h8.5zm0 15.5c2 0 3.5-.5 4.5-1.5 1-1 1.5-2.6 1.5-4.8 0-2.2-.5-3.8-1.5-4.8-1-1-2.5-1.5-4.5-1.5H67.5v12.6H70.5z" />
            <text x="10" y="32" font-family="'Italiana', serif" font-size="28" font-style="italic" fill="#ffffff" letter-spacing="1">Ford</text>
          </svg>
          <span class="brand-tagline">It's the classic performance car that only gets better.</span>
        </div>

        <nav class="nav-links">
          <a href="#build" class="nav-link">BUILD & PRICE</a>
          <a href="#offers" class="nav-link">CURRENT OFFERS</a>
          <button class="menu-btn" aria-label="Menu">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
          </button>
        </nav>
      </header>

      <!-- Main Section 1: Initial Covered Hero -->
      <section class="hero-content" id="hero-title-group">
        <h1 class="hero-title">
          REDISCOVER<br />
          <span class="italic-title">the CLASSICS</span>
        </h1>
      </section>

      <!-- Interactive Arc Slider -->
      <div class="reveal-slider-container" id="slider-container">
        <svg class="arc-svg" viewBox="0 0 600 300">
          <path id="arc-path" d="M 50,280 A 260,260 0 0,1 550,280" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="4 4" />
          <path id="arc-active-path" d="M 50,280 A 260,260 0 0,1 550,280" fill="none" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2" />
        </svg>

        <div class="drag-handle" id="drag-handle" role="slider" aria-label="Drag to reveal car" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <span class="handle-dot"></span>
          <span class="handle-text">DRAG TO REVEAL</span>
        </div>
      </div>

      <!-- Hero Subtext -->
      <div class="hero-description" id="hero-desc">
        <p>It's a look that has spanned generations and continues to evolve — a timeless masterpiece.</p>
      </div>

      <!-- Main Section 2: Revealed Mustang Fastback Title -->
      <section class="revealed-content" id="revealed-group">
        <h2 class="revealed-title">
          MUSTANG<br />
          <span class="italic-subtitle">FASTBACK</span>
        </h2>
        <div class="year-badge">1968</div>
      </section>

      <!-- Footer Share -->
      <footer class="footer-bar">
        <button class="share-btn">SHARE</button>
        <div class="scroll-hint">SCROLL OR DRAG TO UNVEIL</div>
      </footer>
    </div>
  </body>
</html>
